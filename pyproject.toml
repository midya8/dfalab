[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dfalab"
version = "0.1.0"
description = "Exact tiny active DFA learning with independently checked observation tables and equivalence witnesses"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Midya Rahmani"}]
dependencies = []

[project.scripts]
dfalab = "dfalab.__main__:main"

[tool.setuptools.packages.find]
include = ["dfalab*"]
